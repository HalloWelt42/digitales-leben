# Baut die Seite bei jedem Push auf main und veröffentlicht sie als Pages-Seite des Repos. Der Ton des Vorlesens liegt
# im eigenen Zweig vorlesen (nur die Tonspuren, immer genau ein Stand); der Bau legt ihn nach public/vorlesen. Ein Push
# dorthin baut die Seite ebenfalls neu, immer mit dem Code aus main.
name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main, vorlesen]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ton des Vorlesens holen
        run: |
          if git ls-remote --exit-code origin refs/heads/vorlesen > /dev/null; then
            git fetch --depth 1 origin vorlesen
            mkdir -p public/vorlesen
            git archive FETCH_HEAD | tar -x -C public/vorlesen
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichung.outputs.page_url }}
    steps:
      - id: veroeffentlichung
        uses: actions/deploy-pages@v4
